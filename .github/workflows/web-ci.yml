name: web

on:
  push:
    paths: ["web/**", "brand/**", "models/thor/config.py", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "brand/**", "models/thor/config.py", ".github/workflows/web-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
