name: models

on:
  push:
    paths: ["models/**", ".github/workflows/models-ci.yml"]
  pull_request:
    paths: ["models/**", ".github/workflows/models-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Notebook smoke test (CPU, tiny model)
        env:
          THOR_SMOKE_TEST: "1"
          THOR_CODE_DIR: ${{ github.workspace }}
          THOR_ROOT: ${{ runner.temp }}/colab-smoke
        run: |
          pip install nbconvert ipykernel
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP" notebooks/train_thor_30m_colab.ipynb
